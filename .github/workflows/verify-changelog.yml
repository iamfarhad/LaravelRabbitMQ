name: "Verify Changelog"

# The changelog is curated by hand, so this does not write to it. It only
# asserts that a published release has a matching CHANGELOG.md section, turning
# a forgotten entry into a loud failure instead of a silent gap.
#
# It replaces an auto-updater that checked out a non-existent "main" branch and
# therefore failed on every release from 1.3.0 through 1.4.0.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check for (defaults to the latest release tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Assert CHANGELOG has a section for the released version
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${VERSION}" ]; then
            echo "::error::No version to verify."
            exit 1
          fi

          # Tags may or may not carry a leading "v"; the changelog never does.
          version="${VERSION#v}"

          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [${version}]' section. Add the entry on ${{ github.event.repository.default_branch }} and re-run."
            echo "Sections currently present:"
            grep -E '^## \[' CHANGELOG.md | head -10
            exit 1
          fi

          if grep -qE "^## \[${version}\][[:space:]]*$" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::The '## [${version}]' heading has no release date."
          fi

          echo "CHANGELOG.md documents ${version}."
